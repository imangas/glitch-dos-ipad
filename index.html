<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>GlitchDOS</title>

    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Indicar a iOS que se comporte como una Web App -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="GlitchDOS" />

    <!-- Icono para la pantalla de inicio -->
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="manifest" href="manifest.json" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- js-dos v8 style & script -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script src="./games-config.js"></script>

    <script id="tailwind-config">
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          try {
            const reg = await navigator.serviceWorker.register('./sw.js');
            console.log('Service Worker activo en scope:', reg.scope);

            if (navigator.onLine) {
              fetch('https://v8.js-dos.com/latest/wdosbox.wasm', { mode: 'cors' }).catch(() => {});
            }
          } catch (err) {
            console.error('Error registrando Service Worker:', err);
          }
        });
      }

      let gameRuningId = null;

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#57d9d9",
              "on-tertiary": "#502500",
              "surface-tint": "#57d9d9",
              "on-secondary-container": "#b8b8b8",
              secondary: "#c7c6c6",
              "on-secondary-fixed-variant": "#464747",
              tertiary: "#ffb785",
              "secondary-fixed-dim": "#c7c6c6",
              error: "#ffb4ab",
              background: "#131313",
              "on-tertiary-container": "#502500",
              "on-error-container": "#ffdad6",
              "surface-container-low": "#1b1b1b",
              "on-tertiary-fixed-variant": "#713700",
              "outline-variant": "#3c4949",
              "on-error": "#690005",
              "error-container": "#93000a",
              "tertiary-fixed-dim": "#ffb785",
              "primary-container": "#00aaaa",
              "inverse-on-surface": "#303030",
              "surface-bright": "#393939",
              "on-surface-variant": "#bbc9c8",
              surface: "#131313",
              "on-secondary": "#2f3131",
              "surface-container-lowest": "#0e0e0e",
              "surface-variant": "#353535",
              "surface-container-highest": "#353535",
              "on-primary-fixed-variant": "#004f4f",
              "tertiary-fixed": "#ffdcc6",
              "tertiary-container": "#e18032",
              "secondary-container": "#484949",
              "on-tertiary-fixed": "#301400",
              "on-background": "#e2e2e2",
              "on-surface": "#e2e2e2",
              "inverse-surface": "#e2e2e2",
              "on-primary-container": "#003737",
              "secondary-fixed": "#e3e2e2",
              "on-secondary-fixed": "#1a1c1c",
              "on-primary": "#003737",
              "primary-fixed-dim": "#57d9d9",
              "surface-container": "#1f1f1f",
              "on-primary-fixed": "#002020",
              "surface-dim": "#131313",
              outline: "#869393",
              "surface-container-high": "#2a2a2a",
              "inverse-primary": "#006a6a",
              "primary-fixed": "#78f6f5",
            },
            fontFamily: {
              headline: ["Space Grotesk"],
              body: ["Space Grotesk"],
              label: ["Space Grotesk"],
            },
            borderRadius: {
              DEFAULT: "0px",
              lg: "0px",
              xl: "0px",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .ascii-border-b {
        background-image: linear-gradient(
          to right,
          #3c4949 50%,
          transparent 50%
        );
        background-size: 8px 1px;
        background-repeat: repeat-x;
        background-position: bottom;
      }
      .phosphor-glow {
        text-shadow: 0 0 8px rgba(87, 217, 217, 0.4);
      }
      .recessed-panel {
        box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      #detail-panel {
        display: none;
      }
      .config-area {
        color: black;
        height: 250px;
      }
    </style>
  </head>
  <body
    class="bg-background text-on-background font-body select-none overflow-hidden h-screen flex flex-col"
  >
    <!-- TopAppBar -->
    <header
      class="fixed top-0 w-full z-50 border-b border-[#3c4949]/50 bg-[#131313] shadow-[0_0_15px_rgba(87,217,217,0.05)] flex justify-between items-center px-4 h-12 w-full"
    >
      <div class="flex items-center gap-4">
        <span
          id="mobile-menu-button"
          class="md:hidden material-symbols-outlined text-[#c7c6c6] hover:text-primary cursor-pointer text-base p-2 -m-2"
          >menu</span
        >
        <span class="text-lg font-bold text-[#57d9d9] font-['Space_Grotesk']"
          ><strike>C:\SYSTEM\LAUNCHER.EXE</strike></span
        >
        <div class="hidden md:flex gap-6 ml-8">
          <button
            class="font-['Space_Grotesk'] uppercase tracking-tighter text-sm text-[#57d9d9] hover:bg-[#57d9d9] hover:text-[#003737] px-2 py-1 transition-colors duration-0 active:invert"
          >
            <strike>F1:HELP</strike>
          </button>
          <button
            class="font-['Space_Grotesk'] uppercase tracking-tighter text-sm text-[#c7c6c6] hover:bg-[#57d9d9] hover:text-[#003737] px-2 py-1 transition-colors duration-0 active:invert"
          >
            <strike>F2:CONFIG</strike>
          </button>
          <button
            id="save-game-button-desktop"
            class="save-game-button font-['Space_Grotesk'] uppercase tracking-tighter text-sm text-[#c7c6c6] hover:bg-[#57d9d9] hover:text-[#003737] px-2 py-1 transition-colors duration-0 active:invert"
            style="display: none"
          >
            SAVE GAME
          </button>
          <button
            id="exit-game-button-desktop"
            class="exit-game-button font-['Space_Grotesk'] uppercase tracking-tighter text-sm text-[#c7c6c6] hover:bg-[#57d9d9] hover:text-[#003737] px-2 py-1 transition-colors duration-0 active:invert"
            style="display: none"
          >
            EXIT
          </button>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <span
          id="save-game-button-mobile"
          class="save-game-button md:hidden material-symbols-outlined text-[#c7c6c6] hover:text-primary cursor-pointer text-base p-2 -m-2"
          style="display: none"
          title="Save Game"
          >save</span
        >
        <span
          id="exit-game-button-mobile"
          class="exit-game-button md:hidden material-symbols-outlined text-[#c7c6c6] hover:text-primary cursor-pointer text-base p-2 -m-2"
          style="display: none"
          title="Exit Game"
          >power_settings_new</span
        >
        <span class="material-symbols-outlined text-[#57d9d9] text-base">terminal</span>
        <span class="material-symbols-outlined text-[#c7c6c6] text-base">settings</span>
      </div>
    </header>
    <div
      id="game-panel"
      class="flex flex-1 min-h-0 pt-12 pb-14 md:pb-8 overflow-hidden"
      style="width: 100vw; height: 60vw; display: none"
    ></div>
    <!-- Main Layout Container -->
    <div id="dashboard-panel" class="flex flex-1 min-h-0 pt-12 pb-14 md:pb-8 overflow-hidden">
      <!-- SideNavBar -->
      <div
        id="mobile-sidebar-overlay"
        class="hidden fixed inset-0 bg-black/60 z-30"
      ></div>
      <aside
        id="sidebar"
        class="fixed left-0 top-12 bottom-8 w-64 z-40 border-r border-[#3c4949]/50 bg-[#1b1b1b] flex flex-col py-6 -translate-x-full md:translate-x-0 transition-transform duration-200"
      >
        <div class="px-4 mb-6">
          <div
            class="text-[#57d9d9] font-['Space_Grotesk'] font-bold text-xs uppercase opacity-60 mb-2"
          >
            <strike>&gt; DRIVES</strike>
          </div>
          <div class="space-y-1">
            <div
              class="bg-[#57d9d9] text-[#003737] font-bold px-4 py-3 flex items-center gap-3 active:scale-[0.99] cursor-pointer"
            >
              <span
                class="material-symbols-outlined text-sm"
                style="font-variation-settings: &quot;FILL&quot; 1"
                >grid_view</span
              >
              <span class="font-['Space_Grotesk'] font-medium uppercase text-xs"
                ><strike>C: SYSTEM_DRIVE</strike></span
              >
            </div>
            <div
              class="text-[#c7c6c6] px-4 py-3 flex items-center gap-3 hover:text-[#57d9d9] hover:bg-[#2a2a2a] transition-none cursor-pointer"
            >
              <span class="material-symbols-outlined text-sm">storage</span>
              <span class="font-['Space_Grotesk'] font-medium uppercase text-xs"
                ><strike>A: FLOPPY_DISK</strike></span
              >
            </div>
            <div
              class="text-[#c7c6c6] px-4 py-3 flex items-center gap-3 hover:text-[#57d9d9] hover:bg-[#2a2a2a] transition-none cursor-pointer"
            >
              <span class="material-symbols-outlined text-sm">album</span>
              <span class="font-['Space_Grotesk'] font-medium uppercase text-xs"
                ><strike>D: CD-ROM_OS</strike></span
              >
            </div>
          </div>
        </div>
        <div class="px-4 mb-auto overflow-y-auto">
          <div
            class="text-[#57d9d9] font-['Space_Grotesk'] font-bold text-xs uppercase opacity-60 mb-2"
          >
            &gt; SAVED GAMES
          </div>
          <div id="opfs-tree" class="space-y-1 text-[10px]"></div>
        </div>
        <div class="hidden md:block px-4 border-t border-[#3c4949]/30 pt-6">
          <button
            id="install-game-button"
            class="w-full bg-[#2a2a2a] text-[#57d9d9] border border-[#57d9d9]/30 py-3 font-bold text-xs uppercase tracking-widest hover:bg-[#57d9d9] hover:text-[#003737] transition-colors active:scale-95"
          >
            [+] INSTALL NEW GAME
          </button>
          <input type="file" id="rom-input" accept=".zip" class="hidden" />
        </div>
      </aside>
      <!-- Central Content Canvas -->
      <main
        class="ml-0 md:ml-64 mr-0 md:mr-80 flex-1 min-h-0 p-6 overflow-y-auto custom-scrollbar bg-surface-container-lowest"
      >
        <div class="mb-8">
          <p
            class="text-secondary-fixed-dim font-label text-xs tracking-tighter mb-1"
          >
            C:\GAMES\ROOT\ &gt; 10-24-1994
          </p>
          <h1
            class="text-3xl font-bold font-headline text-on-surface phosphor-glow uppercase tracking-tight"
          >
            DOS GAMES
          </h1>
        </div>
        <!-- Game Grid -->
        <div
          id="game_grid"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
        ></div>
      </main>
      <!-- Right Detail Panel -->
      <aside
        id="detail-panel"
        class="fixed left-0 right-0 top-12 bottom-14 md:left-auto md:right-0 md:bottom-8 md:w-80 z-[60] md:z-40 bg-[#1b1b1b] border-l border-outline-variant/50 p-6 flex flex-col overflow-y-auto"
      ></aside>
    </div>
    <!-- Footer / Status Bar -->
    <footer
      class="hidden md:flex fixed bottom-0 w-full h-8 bg-[#1b1b1b] border-t border-[#3c4949]/50 items-center justify-between px-4 z-50"
    >
      <div class="flex gap-6 items-center">
        <div class="flex items-center gap-2">
          <span class="text-[10px] text-secondary"><strike>CONVENTIONAL_MEM:</strike></span>
          <span class="text-[10px] text-primary font-bold"
            ><strike>XXX KB / XXX KB FREE</strike></span
          >
        </div></strike>
        <div class="h-3 w-[1px] bg-outline-variant"></div>
        <div class="flex items-center gap-2">
          <span class="text-[10px] text-secondary"><strike>EXTENDED_MEM:</strike></span>
          <span class="text-[10px] text-primary font-bold"><strike>XXX KB EMS</strike></span>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2 text-[10px] text-secondary">
          <span class="material-symbols-outlined text-[12px]"><strike>schedule</strike></span>
          <span class="font-bold"><strike>21:34:58</strike></span>
        </div>
        <div
          class="bg-primary/20 px-2 py-0.5 text-[10px] text-primary font-bold uppercase"
        >
          <span id="version_info"/>
        </div>
      </div>
    </footer>
    <div
      id="install-game-bar-mobile"
      class="md:hidden fixed bottom-0 w-full h-14 bg-[#1b1b1b] border-t border-[#3c4949]/50 z-50 flex items-center px-4"
    >
      <button
        id="install-game-button-mobile"
        class="w-full bg-[#2a2a2a] text-[#57d9d9] border border-[#57d9d9]/30 py-3 font-bold text-xs uppercase tracking-widest hover:bg-[#57d9d9] hover:text-[#003737] transition-colors active:scale-95 flex items-center justify-center gap-2"
      >
        <span class="material-symbols-outlined text-sm">add</span>
        INSTALL NEW GAME
      </button>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
